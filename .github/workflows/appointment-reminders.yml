name: Recordatorios de citas

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Procesar recordatorios cercanos a 24 horas
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta el secreto CRON_SECRET en GitHub Actions."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --max-time 45 \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://labarber-studio.vercel.app/api/cron/recordatorios
